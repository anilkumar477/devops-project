apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nginx-storage
spec:
  serviceName: nginx-headless
  replicas: 3

  selector:
    matchLabels:
      app: nginx-storage

  template:
    metadata:
      labels:
        app: nginx-storage

    spec:
      containers:
      - name: nginx
        image: nel-nginx:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http

        volumeMounts:
        - name: nginx-data
          mountPath: /usr/share/nginx/html/data

  volumeClaimTemplates:
  - metadata:
      name: nginx-data
    spec:
      accessModes:
      - ReadWriteOnce

      resources:
        requests:
          storage: 1Gi
