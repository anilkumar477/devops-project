apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-probes
  labels:
    app: nginx-probes
spec:
  replicas: 3
  selector:
    matchLabels:
      app: nginx-probes
  template:
    metadata:
      labels:
        app: nginx-probes
    spec:
      containers:
      - name: nginx
        image: nel-nginx:v2
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
          name: http

        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
